Description=Adds a wishlist to the item mall: wish for items and find them again in their own Wishlist list. Also stops the item cards shifting when the scrollbar appears.\nAdd-on for the game's default UI and the Steampunk UI theme. Each window checks which of the two is installed and uses its look.
Changes=Fixed the "Syntax error parsing property declaration" warnings: the game doesn't understand !important, so the look that isn't in use is now hidden another way.
